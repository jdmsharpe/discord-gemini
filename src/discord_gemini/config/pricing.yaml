# Google Gemini API pricing catalog.
#
# Canonical source: https://ai.google.dev/pricing
# Cross-referenced against: https://github.com/pydantic/genai-prices/blob/main/prices/providers/google.yml
# Last-verified: 2026-09-15 (every row re-verified against the live page)
#
# Chat-model prices are USD per million tokens. Thinking tokens are billed at
# the output-token rate. Cache hits (usage_metadata.cached_content_token_count)
# are billed at cached_input_per_million instead of input_per_million; the
# per-token-hour STORAGE charge for explicit caches is NOT modeled here. Video
# and image generation use per-unit (second or image) pricing with
# resolution/size tiers.
#
# Override this file at runtime by setting GEMINI_PRICING_PATH to an alternate
# YAML path — useful for pushing new pricing without a code release.
#
# NOTE: Some chat models (gemini-2.5-pro, gemini-3.1-pro-preview) have tiered
# pricing for prompts > 200K tokens. The rates below are the lower tier; very
# long conversations may cost more in practice.
#
# NOTE: rows here carry the rate in force TODAY; this file cannot express a dated
# rate. Google prices ~24 models promotionally through 2026-12-31 and doubles them
# on 2027-01-01, so re-verify every rate below in late December 2026.

models:
  # GA 2026-09-02, default chat model. Promotional; doubles to $1.50/$7.50 on 2027-01-01.
  gemini-3.8-flash:              { input_per_million: 0.75,  output_per_million: 3.75,  cached_input_per_million: 0.075 }
  # Promotional; doubles to $1.50/$7.50 on 2027-01-01.
  gemini-3.7-flash:              { input_per_million: 0.75,  output_per_million: 3.75,  cached_input_per_million: 0.075 }
  # Promotional; doubles to $1.50/$7.50 on 2027-01-01.
  gemini-3.6-flash:              { input_per_million: 0.75,  output_per_million: 3.75,  cached_input_per_million: 0.075 }
  gemini-3.5-flash:              { input_per_million: 1.50,  output_per_million: 9.0,   cached_input_per_million: 0.15 }
  gemini-3.5-flash-lite:         { input_per_million: 0.30,  output_per_million: 2.50,  cached_input_per_million: 0.03 }
  gemini-3.1-pro-preview:        { input_per_million: 2.0,   output_per_million: 12.0,  cached_input_per_million: 0.20 }
  gemini-3.1-flash-lite:         { input_per_million: 0.25,  output_per_million: 1.50,  cached_input_per_million: 0.025 }
  gemini-3-flash-preview:        { input_per_million: 0.50,  output_per_million: 3.0,   cached_input_per_million: 0.05 }
  gemini-2.5-pro:                { input_per_million: 1.25,  output_per_million: 10.0,  cached_input_per_million: 0.125 }
  gemini-2.5-flash:              { input_per_million: 0.30,  output_per_million: 2.50,  cached_input_per_million: 0.03 }
  gemini-2.5-flash-lite:         { input_per_million: 0.10,  output_per_million: 0.40,  cached_input_per_million: 0.01 }

# Image generation pricing. Input is token-based and output is per-image with
# size tiers ("512", "1k", "2k", "4k"). calculate_image_cost lower-cases the
# requested size, so the canonical uppercase option values ("1K", "4K") hit these
# rows; a size with no row bills at `default`.
image_generation:
  # GA ids (replaced the -preview ids on 2026-05-28; previews discontinue 2026-06-25).
  # 512 (747 IMAGE tokens = $0.045) and 4K (2,520 tokens = $0.151, "$0.151 per 4K
  # image" on the pricing page) verified by live probe 2026-08-28.
  gemini-3.1-flash-image:
    input_per_million: 0.50
    per_image_by_size:
      default: 0.067
      "512": 0.045
      1k: 0.067
      2k: 0.101
      4k: 0.151
  # Lite generates 1K only — 2K returns "Image size 2K is not supported for this
  # model" (400), and 512 and 4K return the same 400 (probed 2026-08-28), so no
  # other tier exists to price.
  gemini-3.1-flash-lite-image:
    input_per_million: 0.25
    per_image_by_size:
      default: 0.0336
      1k: 0.0336
  # 4K (2,000 IMAGE tokens = $0.24) verified by live probe 2026-08-28; 512 is a 400.
  gemini-3-pro-image:
    input_per_million: 2.00
    per_image_by_size:
      default: 0.134
      1k: 0.134
      2k: 0.134
      4k: 0.24
  gemini-2.5-flash-image:
    input_per_million: 0.30
    per_image_by_size:
      default: 0.039
      1k: 0.039

# Video generation pricing (per second, keyed by resolution).
video_generation:
  veo-3.1-lite-generate-preview:
    per_second_by_resolution: { default: 0.05, 720p: 0.05, 1080p: 0.08 }
  veo-3.1-generate-preview:
    per_second_by_resolution: { default: 0.40, 720p: 0.40, 1080p: 0.40, 4k: 0.60 }
  veo-3.1-fast-generate-preview:
    per_second_by_resolution: { default: 0.10, 720p: 0.10, 1080p: 0.12, 4k: 0.30 }

# Interactions-API video generation billed per video-modality OUTPUT token
# (not per second). A default 720p clip bills ~57,920 video tokens (~$1.01 at
# 17.50/MTok), and a 3 s 1080p clip on gemini-omni-1.1-flash billed the SAME
# 57,920 (live probe 2026-08-28): the count is flat per clip, not per second or
# per resolution, so never derive a duration or a per-resolution rate from it.
video_tokenized:
  # GA 2026-08-27 (default video model); same per-token rate as the preview.
  gemini-omni-1.1-flash:
    video_output_per_million: 17.50
  # Legacy preview id, shuts down 2026-09-30; stays selectable and priced until then.
  gemini-omni-flash-preview:
    video_output_per_million: 17.50

# TTS models — tokenized input/output like chat models.
# Audio output tokens correspond to ~25 tokens per second of audio.
text_to_speech:
  gemini-3.1-flash-tts-preview: { input_per_million: 1.00, output_per_million: 20.00 }
  gemini-2.5-flash-preview-tts: { input_per_million: 0.50, output_per_million: 10.00 }
  gemini-2.5-pro-preview-tts:   { input_per_million: 1.00, output_per_million: 20.00 }

# Music generation billed per generated song, not per second — Lyria 3 Clip is a
# fixed 30-second clip and Lyria 3 Pro is a full song, both one flat charge.
# lyria-realtime-exp streams audio and has no published per-song price, so it is
# left explicitly unpriced (null) rather than billed at an invented rate.
music_generation:
  lyria-3.5:            { per_song: 0.08 }  # "Lyria 3.5 (Full Song)", Interactions API
  lyria-3-clip-preview: { per_song: 0.04 }
  lyria-3-pro-preview:  { per_song: 0.08 }
  lyria-realtime-exp:   { per_song: null }

tools:
  google_maps_grounding:
    # Per grounded prompt, keyed by model-id prefix (longest matching prefix wins;
    # ids matching no prefix bill at `per_request`). Gemini 3.x
    # gets 5,000 grounded prompts per month free, shared across Gemini 3, then
    # $14 / 1K; that free tier cannot be tracked here, so the gemini-3 rate is an
    # UPPER BOUND. Gemini 2.5 has no free tier: $25 / 1K grounded prompts.
    per_request_by_model_prefix:
      gemini-3:   0.014
      gemini-2.5: 0.025
    per_request: 0.025  # fallback for ids matching no prefix above

fallbacks:
  unknown_chat_model:  { input_per_million: 2.0,  output_per_million: 12.0 }
  unknown_image_model:
    input_per_million: 0.50
    per_image: 0.067
  unknown_video_model: { per_second: 0.35 }
  unknown_video_tokenized_model: { video_output_per_million: 17.50 }
  unknown_tts_model:   { input_per_million: 0.50, output_per_million: 10.00 }
